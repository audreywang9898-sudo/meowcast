name: Melbourne Meowcast

on:
  push:
    branches: [main]
    paths:
      - '.github/trigger-melbourne-preview'
  workflow_dispatch:
    inputs:
      period:
        description: 'Edition to generate'
        required: true
        default: morning
        type: choice
        options:
          - morning
          - evening
      publish:
        description: 'Publish to Melbourne Instagram after generation'
        required: false
        default: false
        type: boolean
      republish:
        description: 'Bypass Melbourne slot dedupe for this manual run'
        required: false
        default: false
        type: boolean
  schedule:
    # Keep Melbourne wall-clock times stable across AEST/AEDT.
    # Avoid :00/:01 and use multiple deduped recovery triggers.
    - cron: '7 7 * * *'
      timezone: 'Australia/Melbourne'
    - cron: '17 7 * * *'
      timezone: 'Australia/Melbourne'
    - cron: '27 7 * * *'
      timezone: 'Australia/Melbourne'
    - cron: '37 7 * * *'
      timezone: 'Australia/Melbourne'
    - cron: '7 8 * * *'
      timezone: 'Australia/Melbourne'
    # Early recovery probes: safe before 16:25, useful if GitHub delivers them late.
    - cron: '30 13 * * *'
      timezone: 'Australia/Melbourne'
    - cron: '30 14 * * *'
      timezone: 'Australia/Melbourne'
    - cron: '30 15 * * *'
      timezone: 'Australia/Melbourne'
    - cron: '30 16 * * *'
      timezone: 'Australia/Melbourne'
    - cron: '40 16 * * *'
      timezone: 'Australia/Melbourne'
    - cron: '50 16 * * *'
      timezone: 'Australia/Melbourne'
    - cron: '7 17 * * *'
      timezone: 'Australia/Melbourne'

permissions:
  contents: read

concurrency:
  group: melbourne-meowcast-publisher
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    env:
      CITY: melbourne
      MELBOURNE_PRODUCTION_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Melbourne local slot
        id: slot
        env:
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}
          MANUAL_PERIOD: ${{ inputs.period }}
          MANUAL_PUBLISH: ${{ inputs.publish }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo

          event=os.environ.get("GITHUB_EVENT_NAME","")
          tz=ZoneInfo("Australia/Melbourne")
          run=True
          valid=True
          publish=False
          slot=""
          period=""

          if event=="workflow_dispatch":
              period=os.environ.get("MANUAL_PERIOD","morning")
              slot="1630" if period=="evening" else "0700"
              publish=os.environ.get("MANUAL_PUBLISH","false").lower()=="true"
              date=datetime.now(tz).date().isoformat()
              reason=f"manual {period} preview/publish"
          elif event=="push":
              try:
                  trigger=open(".github/trigger-melbourne-preview",encoding="utf-8").read()
              except FileNotFoundError:
                  trigger=""
              period="evening" if "evening" in trigger else "morning"
              slot="1630" if period=="evening" else "0700"
              publish="force-publish" in trigger
              date=datetime.now(tz).date().isoformat()
              reason=f"Melbourne forced {period} production publish trigger" if publish else f"Melbourne non-publishing {period} preview trigger"
          else:
              if os.environ.get("MELBOURNE_PRODUCTION_ENABLED","").lower()!="true":
                  run=False
                  reason="Melbourne production schedule is gated off"
                  date=datetime.now(tz).date().isoformat()
              else:
                  trigger=os.environ.get("TRIGGER_SCHEDULE","").strip()
                  now=datetime.now(tz)
                  date=now.date().isoformat()
                  morning={"7 7 * * *","17 7 * * *","27 7 * * *","37 7 * * *","7 8 * * *"}
                  evening_probe={"30 13 * * *","30 14 * * *","30 15 * * *"}
                  evening={"30 16 * * *","40 16 * * *","50 16 * * *","7 17 * * *"}
                  if trigger in morning:
                      period="morning"; slot="0700"; publish=True
                      reason=f"Melbourne morning local-time cron: {trigger}"
                  elif trigger in evening_probe or trigger in evening:
                      period="evening"; slot="1630"
                      if trigger in evening_probe and (now.hour, now.minute) < (16,25):
                          run=False; publish=False
                          reason=f"Melbourne early evening recovery probe exited safely: {trigger}"
                      else:
                          publish=True
                          reason=f"Melbourne evening local-time cron: {trigger}"
                  else:
                      run=False; valid=False
                      reason=f"unknown Melbourne schedule trigger: {trigger!r}"
                  if run:
                      # Resolve the intended local cron date when a runner starts after midnight.
                      minute,hour=map(int,trigger.split()[:2])
                      intended=now.replace(hour=hour,minute=minute,second=0,microsecond=0)
                      if intended>now:
                          intended-=timedelta(days=1)
                      date=intended.date().isoformat()

          print(reason)
          print(f"run={run} publish={publish} date={date} period={period} slot={slot}")
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write(f"run={'true' if run else 'false'}\n")
              out.write(f"valid={'true' if valid else 'false'}\n")
              out.write(f"publish={'true' if publish else 'false'}\n")
              out.write(f"date={date}\n")
              out.write(f"period={period}\n")
              out.write(f"slot={slot}\n")
          PY

      - name: Reject unknown scheduled trigger
        if: github.event_name == 'schedule' && steps.slot.outputs.valid != 'true'
        run: |
          echo "ERROR: Melbourne schedule did not resolve to a production slot."
          exit 1

      - uses: actions/setup-python@v5
        if: steps.slot.outputs.run == 'true'
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        if: steps.slot.outputs.run == 'true'
        timeout-minutes: 12
        run: |
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo timeout 240s apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=30
          sudo timeout 300s apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk
          python -m pip install --disable-pip-version-check --timeout 30 --retries 2 -r requirements.txt

      - name: Check Melbourne publication evidence
        if: steps.slot.outputs.run == 'true' && steps.slot.outputs.publish == 'true'
        id: dedupe
        env:
          SLOT: ${{ steps.slot.outputs.slot }}
          PUBLISH_DATE: ${{ steps.slot.outputs.date }}
        run: |
          if { [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "${{ inputs.republish }}" = "true" ]; } || { [ "$GITHUB_EVENT_NAME" = "push" ] && grep -q "force-republish" .github/trigger-melbourne-preview 2>/dev/null; }; then
            echo "Explicit Melbourne republish requested."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PREFIX="latest/melbourne"
          MARKER="${PUBLISH_DATE}-${SLOT}"
          BASE="https://raw.githubusercontent.com/audreywang9898-sudo/meowcast-media/main/${PREFIX}"
          PUBLISHED=$(curl -fsSL "${BASE}/published-slot.txt?run=${GITHUB_RUN_ID}" || true)
          VALID=false
          if [ "$PUBLISHED" = "$MARKER" ] && curl -fsSL "${BASE}/published-evidence-${SLOT}.json?run=${GITHUB_RUN_ID}" -o /tmp/evidence.json; then
            if PUBLISH_DATE="$PUBLISH_DATE" SLOT="$SLOT" python - <<'PY'
          import json, os, sys
          from datetime import datetime, time
          from zoneinfo import ZoneInfo
          try:
              e=json.load(open("/tmp/evidence.json",encoding="utf-8"))
              if e.get("date")!=os.environ["PUBLISH_DATE"] or e.get("slot")!=os.environ["SLOT"]:
                  raise ValueError("date/slot mismatch")
              published=datetime.fromisoformat(e["published_at"].replace("Z","+00:00")).astimezone(ZoneInfo("Australia/Melbourne"))
              d=datetime.fromisoformat(os.environ["PUBLISH_DATE"]).date()
              cutoff=time(6,45) if os.environ["SLOT"]=="0700" else time(16,20)
              if published.date()!=d or published.time()<cutoff:
                  raise ValueError("publish time outside valid slot window")
          except Exception as exc:
              print(exc)
              sys.exit(1)
          PY
            then
              VALID=true
            fi
          fi

          if [ "$PUBLISHED" = "$MARKER" ] && [ "$VALID" = "true" ]; then
            echo "Melbourne slot already published with valid evidence: $MARKER"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Melbourne Reel
        if: steps.slot.outputs.run == 'true' && (steps.slot.outputs.publish != 'true' || steps.dedupe.outputs.skip != 'true')
        env:
          MEOWCAST_PERIOD: ${{ steps.slot.outputs.period }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python render.py

      - name: Verify generated files
        if: steps.slot.outputs.run == 'true' && (steps.slot.outputs.publish != 'true' || steps.dedupe.outputs.skip != 'true')
        run: |
          test -s output/card.jpg
          test -s output/meowcast.mp4
          test -s output/caption.txt
          test -s output/weather-state.json
          ffprobe -v error -show_entries stream=codec_type,codec_name -of compact output/meowcast.mp4

      - name: Upload Melbourne preview artifact
        if: steps.slot.outputs.run == 'true' && (steps.slot.outputs.publish != 'true' || steps.dedupe.outputs.skip != 'true')
        uses: actions/upload-artifact@v4
        with:
          name: melbourne-meowcast-${{ steps.slot.outputs.period }}-${{ github.run_id }}
          path: output/

      - name: Upload Melbourne Reel to public media URL
        if: steps.slot.outputs.run == 'true' && steps.slot.outputs.publish == 'true' && steps.dedupe.outputs.skip != 'true'
        id: media
        env:
          MEDIA_REPO_TOKEN: ${{ secrets.MEDIA_REPO_TOKEN }}
          PUBLISH_DATE: ${{ steps.slot.outputs.date }}
          SLOT: ${{ steps.slot.outputs.slot }}
        run: |
          test -n "$MEDIA_REPO_TOKEN" || (echo "MEDIA_REPO_TOKEN missing" && exit 1)
          MEDIA_PATH="melbourne/reels/${PUBLISH_DATE}/meowcast-${SLOT}-${GITHUB_RUN_ID}.mp4"
          git clone "https://x-access-token:${MEDIA_REPO_TOKEN}@github.com/audreywang9898-sudo/meowcast-media.git" /tmp/media
          mkdir -p "/tmp/media/$(dirname "$MEDIA_PATH")"
          cp output/meowcast.mp4 "/tmp/media/$MEDIA_PATH"
          cd /tmp/media
          git config user.name "meowcast-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$MEDIA_PATH"
          git commit -m "Add Melbourne Meowcast Reel ${PUBLISH_DATE} ${SLOT} run ${GITHUB_RUN_ID}"
          git push origin main
          echo "url=https://raw.githubusercontent.com/audreywang9898-sudo/meowcast-media/main/$MEDIA_PATH" >> "$GITHUB_OUTPUT"

      - name: Publish Melbourne Reel to Instagram
        if: steps.slot.outputs.run == 'true' && steps.slot.outputs.publish == 'true' && steps.dedupe.outputs.skip != 'true'
        env:
          IG_USER_ID: ${{ secrets.MELBOURNE_IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.MELBOURNE_IG_ACCESS_TOKEN }}
          REEL_PUBLIC_URL: ${{ steps.media.outputs.url }}?run=${{ github.run_id }}
        run: |
          test -n "$IG_USER_ID" || (echo "MELBOURNE_IG_USER_ID missing" && exit 1)
          test -n "$IG_ACCESS_TOKEN" || (echo "MELBOURNE_IG_ACCESS_TOKEN missing" && exit 1)
          python publish_instagram.py

      - name: Persist Melbourne publication state
        if: steps.slot.outputs.run == 'true' && steps.slot.outputs.publish == 'true' && steps.dedupe.outputs.skip != 'true' && success()
        env:
          MEDIA_REPO_TOKEN: ${{ secrets.MEDIA_REPO_TOKEN }}
          PUBLISH_DATE: ${{ steps.slot.outputs.date }}
          SLOT: ${{ steps.slot.outputs.slot }}
        run: |
          # A successful workflow is insufficient: require this run's Meta receipt.
          python - <<'PY'
          import json, os
          result=json.load(open("output/publish-result.json",encoding="utf-8"))
          expected="melbourne"
          if result.get("status")!="published" or not result.get("media_id") or not result.get("container_id") or result.get("city")!=expected or result.get("run_id")!=os.environ.get("GITHUB_RUN_ID"):
              raise SystemExit("Missing or invalid Meta publication receipt; refusing success marker")
          PY
          PREFIX="latest/melbourne"
          MARKER="${PUBLISH_DATE}-${SLOT}"
          git clone "https://x-access-token:${MEDIA_REPO_TOKEN}@github.com/audreywang9898-sudo/meowcast-media.git" /tmp/state
          mkdir -p "/tmp/state/$PREFIX"
          printf "%s" "$MARKER" > "/tmp/state/$PREFIX/published-slot.txt"
          cp output/weather-state.json "/tmp/state/$PREFIX/weather-state-${SLOT}.json"
          PUBLISHED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          PREFIX="$PREFIX" PUBLISHED_AT="$PUBLISHED_AT" PUBLISH_DATE="$PUBLISH_DATE" SLOT="$SLOT" python - <<'PY'
          import json, os
          base="/tmp/state/"+os.environ["PREFIX"]
          slot=os.environ["SLOT"]
          candidate=json.load(open("output/weather-state.json",encoding="utf-8"))
          rotation=f"{base}/weather-rotation-{slot}.json"
          try:
              state=json.load(open(rotation,encoding="utf-8"))
          except Exception:
              state={}
          state[candidate["theme"]]=candidate["index"]
          with open(rotation,"w",encoding="utf-8") as f:
              json.dump(state,f,ensure_ascii=False,sort_keys=True)
          receipt=json.load(open("output/publish-result.json",encoding="utf-8"))
          evidence={
              "media_id":receipt["media_id"],
              "container_id":receipt["container_id"],
              "status":"published",
              "city":"melbourne",
              "date":os.environ["PUBLISH_DATE"],
              "slot":slot,
              "run_id":os.environ.get("GITHUB_RUN_ID"),
              "published_at":os.environ["PUBLISHED_AT"],
          }
          with open(f"{base}/published-evidence-{slot}.json","w",encoding="utf-8") as f:
              json.dump(evidence,f,ensure_ascii=False,sort_keys=True)
          PY
          cd /tmp/state
          git config user.name "meowcast-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$PREFIX"
          git commit -m "Mark Melbourne Meowcast published $MARKER"
          git push origin main
