name: Weekly Meowcast carousels

on:
  push:
    branches: [main]
    paths:
      - '.github/recovery/weekly-*'
  schedule:
    # GitHub schedule events are best-effort and may be delayed or dropped.
    # Avoid the top-of-hour minute; all triggers use the Sunday Taipei date.
    # Publication is deduplicated by weekly/{city}/{week_start}/state.json.
    - cron: '7,23,41 8 * * 0'
      timezone: Asia/Taipei
    - cron: '11,37 9 * * 0'
      timezone: Asia/Taipei
    - cron: '19,47 10 * * 0'
      timezone: Asia/Taipei
    - cron: '23 11 * * 0'
      timezone: Asia/Taipei
  workflow_dispatch:
    inputs:
      issue_date:
        description: 'Sunday issue date; blank means the next Sunday'
        type: string
        required: false
      publish:
        description: 'Publish the two-slide weekly carousel to each city account'
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: meowcast-weekly-carousels
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        city: [taipei, melbourne]
    env:
      CITY: ${{ matrix.city }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve Sunday issue and publish mode
        id: slot
        env:
          ISSUE_DATE: ${{ inputs.issue_date }}
          PUBLISH: ${{ inputs.publish }}
          WEEKLY_RECOVERY_PUSH: ${{ github.event_name == 'push' && 'true' || 'false' }}
        run: python weekly_schedule.py
      - name: Install dependencies
        if: steps.slot.outputs.run == 'true'
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Render weekly images and caption
        if: steps.slot.outputs.run == 'true'
        env:
          ISSUE_DATE: ${{ steps.slot.outputs.issue_date }}
          PUBLISH: ${{ steps.slot.outputs.publish }}
        run: |
          if [ "$PUBLISH" = "true" ]; then MODE=--production; else MODE=--dry-run; fi
          python weekly.py --city "$CITY" --issue-date "$ISSUE_DATE" "$MODE" --output output/weekly
      - name: Publish two-slide weekly carousel with persistent dedupe
        if: steps.slot.outputs.run == 'true' && steps.slot.outputs.publish == 'true'
        env:
          ISSUE_DATE: ${{ steps.slot.outputs.issue_date }}
          MEDIA_REPO_TOKEN: ${{ secrets.MEDIA_REPO_TOKEN }}
          TAIPEI_IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TAIPEI_IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MELBOURNE_IG_USER_ID: ${{ secrets.MELBOURNE_IG_USER_ID }}
          MELBOURNE_IG_ACCESS_TOKEN: ${{ secrets.MELBOURNE_IG_ACCESS_TOKEN }}
        run: |
          if [ "$CITY" = "taipei" ]; then
            export IG_USER_ID="$TAIPEI_IG_USER_ID" IG_ACCESS_TOKEN="$TAIPEI_IG_ACCESS_TOKEN"
          else
            export IG_USER_ID="$MELBOURNE_IG_USER_ID" IG_ACCESS_TOKEN="$MELBOURNE_IG_ACCESS_TOKEN"
          fi
          EXTRA=()
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then EXTRA+=(--manual-early); fi
          python weekly_publish.py --city "$CITY" --issue-date "$ISSUE_DATE" --publish "${EXTRA[@]}"
      - name: Upload weekly images, captions and result
        if: always() && steps.slot.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: weekly-${{ matrix.city }}-${{ github.run_id }}
          path: output/weekly/
          if-no-files-found: warn
          retention-days: 14
