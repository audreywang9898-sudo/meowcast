name: Sunny Animation Prototype
on:
  push:
    branches: [main]
    paths:
      - 'animate_prototype.py'
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow==11.1.0
      - name: Build prototype
        run: python animate_prototype.py
      - name: Verify video
        run: ffprobe -v error -show_entries format=duration -show_entries stream=codec_name,width,height -of default=noprint_wrappers=1 output/sunny-animation-prototype.mp4
      - name: Upload prototype
        env:
          MEDIA_REPO_TOKEN: ${{ secrets.MEDIA_REPO_TOKEN }}
        run: |
          git clone "https://x-access-token:${MEDIA_REPO_TOKEN}@github.com/audreywang9898-sudo/meowcast-media.git" /tmp/media
          mkdir -p /tmp/media/prototype
          cp output/sunny-animation-prototype.mp4 /tmp/media/prototype/sunny-animation-prototype.mp4
          cd /tmp/media
          git config user.name "meowcast-bot"
          git config user.email "actions@users.noreply.github.com"
          git add prototype/sunny-animation-prototype.mp4
          git commit -m "Update Sunny animation prototype" || exit 0
          git push origin main
