name: Yearly Calendar Update

on:
  schedule:
    # 00:15 UTC = 08:15 Asia/Taipei on Dec 1
    - cron: '15 0 1 12 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-next-year:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Generate next year's calendar
        run: python generate_next_calendar.py
      - name: Validate calendar and referenced assets/music
        run: |
          python - <<'PY'
          import json, os
          c=json.load(open("calendar_next.json",encoding="utf-8"))
          assert c["events"], "calendar has no events"
          missing=[]
          for day,e in c["events"].items():
              asset=e.get("asset")
              music=e.get("music")
              if asset and not os.path.isfile("asset/"+asset):
                  missing.append("asset/"+asset)
              if music and not any(os.path.isfile(f"music/{music}.{ext}") for ext in ("mp3","wav","m4a")):
                  missing.append("music/"+music+".(mp3|wav|m4a)")
          if missing:
              print("WARNING: missing optional media:")
              print("\n".join(sorted(set(missing))))
          print(f'Validated calendar year {c["year"]}: {len(c["events"])} events')
          PY
      - name: Commit updated calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar_next.json
          git diff --cached --quiet && exit 0
          git commit -m "Prepare next-year calendar"
          git push origin main
