name: Validate Taipei 2027 H1 Artwork

on:
  push:
    branches: [main]
    paths:
      - 'validate_2027_h1_artwork.py'
      - 'calendar/2027.json'
      - 'asset/taipei/2027-h1/**'
      - 'render.py'
      - '.github/workflows/validate-2027-h1-artwork.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CITY: taipei
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: pip install -r requirements.txt
      - name: Decode, resolve and render all 31 festival images
        run: python validate_2027_h1_artwork.py
      - name: Upload 31 preview JPEGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taipei-2027-h1-holiday-previews
          path: dry-run/2027-h1/*.jpg
          if-no-files-found: warn
          retention-days: 30
