name: Weekly pawcast preview (dry run only)
on:
  workflow_dispatch:
    inputs:
      issue_date:
        description: "Sunday issue date (YYYY-MM-DD)"
        required: true
        type: string
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install rendering dependencies
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Render both cities without publishing
        env:
          ISSUE_DATE: ${{ inputs.issue_date }}
        run: |
          python weekly.py --city taipei --issue-date "$ISSUE_DATE" --dry-run
          python weekly.py --city melbourne --issue-date "$ISSUE_DATE" --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: weekly-pawcast-preview
          path: dry-run/weekly/
          if-no-files-found: error
          retention-days: 14
