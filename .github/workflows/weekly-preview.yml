name: Weekly pawcast preview (dry run only)
on:
  push:
    branches: [main]
    paths:
      - 'weekly.py'
      - 'weekly_publish.py'
      - 'weekly_schedule.py'
      - 'test_weekly.py'
      - '.github/workflows/weekly-preview.yml'
  workflow_dispatch:
    inputs:
      issue_date:
        description: 'Sunday issue date (blank means next Sunday)'
        required: false
        type: string
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve preview issue date
        id: slot
        env:
          ISSUE_DATE: ${{ inputs.issue_date }}
          PUBLISH: 'false'
        run: python weekly_schedule.py
      - name: Install rendering dependencies
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify week selection and duplicate prevention
        run: python -m unittest test_weekly -v
      - name: Verify both Instagram credentials (read only)
        env:
          TAIPEI_IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TAIPEI_IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MELBOURNE_IG_USER_ID: ${{ secrets.MELBOURNE_IG_USER_ID }}
          MELBOURNE_IG_ACCESS_TOKEN: ${{ secrets.MELBOURNE_IG_ACCESS_TOKEN }}
          MEDIA_REPO_TOKEN: ${{ secrets.MEDIA_REPO_TOKEN }}
        run: |
          python - <<'PY'
          import os, tempfile
          from pathlib import Path
          from weekly_publish import Instagram, MediaStore
          for city in ('TAIPEI', 'MELBOURNE'):
              os.environ['IG_USER_ID'] = os.environ[city + '_IG_USER_ID']
              os.environ['IG_ACCESS_TOKEN'] = os.environ[city + '_IG_ACCESS_TOKEN']
              Instagram().identity()
              print(city + ' Instagram credentials verified (read only)')
          with tempfile.TemporaryDirectory() as tmp:
              MediaStore(Path(tmp) / 'repo', 'taipei', 'credential-check')
          print('Media repository read access verified; no files pushed')
          PY
      - name: Render both cities without publishing
        env:
          ISSUE_DATE: ${{ steps.slot.outputs.issue_date }}
        run: |
          python weekly.py --city taipei --issue-date "$ISSUE_DATE" --dry-run
          python weekly.py --city melbourne --issue-date "$ISSUE_DATE" --dry-run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-pawcast-preview
          path: dry-run/weekly/
          if-no-files-found: warn
          retention-days: 14
