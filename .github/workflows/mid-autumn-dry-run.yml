name: Mid-Autumn Compact-UI Dry Run
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mid-autumn-dry-run.yml'

permissions:
  contents: write

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Render 2026-09-25 without publishing
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python - <<'PY'
          import render
          real_get_weather = render.get_weather
          def dry_weather():
              w = real_get_weather()
              w["date"] = "2026-09-25"
              return w
          render.get_weather = dry_weather
          render.main()
          PY
      - name: Verify dry-run outputs
        run: |
          test -s output/card.jpg
          test -s output/meowcast.mp4
          test -s output/caption.txt
          ffprobe -v error -show_entries format=duration -show_entries stream=codec_type,codec_name -of compact output/meowcast.mp4
      - name: Save preview to GitHub
        run: |
          mkdir -p dry-run
          cp output/card.jpg dry-run/mid_autumn_2026-09-25.jpg
          cp output/caption.txt dry-run/mid_autumn_2026-09-25-caption.txt
          git config user.name "meowcast-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dry-run/
          git commit -m "Add Mid-Autumn dry-run preview" || exit 0
          git push origin main
