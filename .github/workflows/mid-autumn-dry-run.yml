name: Today Weather-Label Dry Run
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mid-autumn-dry-run.yml'

permissions:
  contents: write

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Render today's real weather without publishing
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python - <<'PY'
          import render
          render.main()
          PY
      - name: Verify dry-run outputs
        run: |
          test -s output/card.jpg
          test -s output/meowcast.mp4
          test -s output/caption.txt
          ffprobe -v error -show_entries format=duration -show_entries stream=codec_type,codec_name -of compact output/meowcast.mp4
      - name: Save preview to GitHub
        run: |
          mkdir -p dry-run
          cp output/card.jpg dry-run/today_weather.jpg
          cp output/caption.txt dry-run/today_weather-caption.txt
          git config user.name "meowcast-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dry-run/
          git commit -m "Add today's weather-label dry-run preview" || exit 0
          git push origin main
