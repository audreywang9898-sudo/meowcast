name: Check Melbourne Instagram Connection

on:
  push:
    branches: [main]
    paths:
      - '.github/trigger-melbourne-ig-check'
      - '.github/workflows/check-melbourne-instagram.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requests
        run: pip install requests

      - name: Verify Melbourne Instagram credentials
        env:
          IG_USER_ID: ${{ secrets.MELBOURNE_IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.MELBOURNE_IG_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import os, requests, json

          ig=os.environ.get("IG_USER_ID","").strip()
          token=os.environ.get("IG_ACCESS_TOKEN","").strip()
          if not ig:
              raise SystemExit("MELBOURNE_IG_USER_ID is missing")
          if not token:
              raise SystemExit("MELBOURNE_IG_ACCESS_TOKEN is missing")

          url="https://graph.instagram.com/v24.0/me"
          r=requests.get(url,params={
              "fields":"id,username",
              "access_token":token,
          },timeout=30)

          if not r.ok:
              try:
                  detail=r.json()
              except Exception:
                  detail={"raw":r.text}
              raise SystemExit(
                  f"Instagram credential check failed HTTP {r.status_code}: "
                  + json.dumps(detail,ensure_ascii=False)
              )

          data=r.json()
          print("Instagram token is valid")
          print("Instagram user id:",data.get("id"))
          print("Instagram username:",data.get("username"))
          if str(data.get("id")) != str(ig):
              raise SystemExit(
                  "MELBOURNE_IG_USER_ID does not match the account authorized by the token. "
                  f"Use this ID instead: {data.get('id')}"
              )

          print("Melbourne Instagram connection OK")
          PY
