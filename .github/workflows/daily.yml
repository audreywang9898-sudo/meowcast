name: Daily Meowcast
on:
  schedule:
    # 23:00 UTC = 07:00 Asia/Taipei; 08:30 UTC = 16:30 Asia/Taipei
    # Primary + recovery triggers. Dedupe makes recovery runs safe.
    - cron: '1 23 * * *'   # 07:01 Taipei primary
    - cron: '11 23 * * *'  # 07:11 recovery
    - cron: '21 23 * * *'  # 07:21 recovery
    - cron: '30 8 * * *'   # 16:30 Taipei primary
    - cron: '40 8 * * *'   # 16:40 recovery
    - cron: '50 8 * * *'   # 16:50 recovery
    - cron: '0 9 * * *'     # 17:00 final GitHub self-guard
  workflow_dispatch:
    inputs:
      republish:
        description: 'Explicit one-time republish; bypass slot dedupe only for manual dispatch'
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - '.github/trigger-meowcast-evening'
      - '.github/recovery/morning-*'
      - '.github/recovery/evening-*'

permissions:
  contents: read

jobs:
  reel:
    runs-on: ubuntu-latest
    env:
      CITY: taipei
    concurrency:
      # Serialize each slot. Recovery runs queue behind an in-flight primary run,
      # then dedupe against the published marker before doing any work.
      group: meowcast-publisher-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Check schedule config
        id: schedule
        env:
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo

          cfg=json.load(open("schedule.json",encoding="utf-8"))
          event=os.environ.get("GITHUB_EVENT_NAME","")
          tz=ZoneInfo(cfg.get("timezone","Asia/Taipei"))
          now=datetime.now(tz)
          now_utc=datetime.now(timezone.utc)
          run=True
          slot="manual"
          reason="manual run"

          if event=="push":
              # Production recovery: workflow-file pushes default to evening; trigger marker can select morning.
              # This also gives the guard a second recovery path if a trigger-file push is not dispatched.
              
              before=os.environ.get("GITHUB_EVENT_BEFORE","")
              # Morning recovery pushes use a dedicated marker in the commit message/file.
              try:
                  recovery_trigger=open(".github/trigger-meowcast-evening",encoding="utf-8").read()
              except FileNotFoundError:
                  recovery_trigger=""
              if "force-morning" in recovery_trigger:
                  slot="0700"
                  reason="production morning recovery trigger"
              else:
                  slot="1630"
                  reason="production evening recovery trigger"
          elif event=="schedule":
              if not cfg.get("enabled", True):
                  run=False; reason="schedule disabled"
              else:
                  # Identify the intended slot from the cron expression that fired.
                  # Do NOT infer it from wall-clock start time: GitHub schedule jobs can be delayed.
                  trigger=os.environ.get("TRIGGER_SCHEDULE","").strip()
                  morning={"1 23 * * *","11 23 * * *","21 23 * * *"}
                  evening={"30 8 * * *","40 8 * * *","50 8 * * *","0 9 * * *"}
                  if trigger in morning:
                      run=True; slot="0700"; reason=f"morning cron trigger: {trigger}"
                      # GitHub Actions cron may start many hours late. The publish
                      # date must come from the cron's intended UTC day, not the
                      # runner's delayed Taipei wall clock. 23:xx UTC belongs to
                      # the following Taipei calendar day.
                      intended_date=(now_utc.date()+timedelta(days=1)).isoformat()
                  elif trigger in evening:
                      run=True; slot="1630"; reason=f"evening cron trigger: {trigger}"
                      # 08:30-09:00 UTC belongs to the same Taipei calendar day.
                      # Keeping the UTC calendar date prevents a delayed evening
                      # run after Taipei midnight from becoming tomorrow's slot.
                      intended_date=now_utc.date().isoformat()
                  else:
                      run=False; reason=f"unknown schedule trigger: {trigger!r}"

          date=intended_date if event=="schedule" and run else now.strftime("%Y-%m-%d")
          print(reason)
          print(f"date={date} slot={slot}")
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write(f"run={'true' if run else 'false'}\n")
              out.write(f"date={date}\n")
              out.write(f"slot={slot}\n")
          PY

      - name: Reject unknown scheduled trigger
        if: github.event_name == 'schedule' && steps.schedule.outputs.run != 'true'
        run: |
          echo "ERROR: scheduled workflow did not map to a publish slot."
          echo "This prevents a false-green run where every publish step is skipped."
          exit 1

      - name: Verify next-year calendar on December 2
        if: steps.schedule.outputs.run == 'true'
        env:
          PUBLISH_DATE: ${{ steps.schedule.outputs.date }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          today=os.environ["PUBLISH_DATE"]
          year,month,day=map(int,today.split("-"))
          if (month,day)!=(12,2):
              print("Not December 2; yearly calendar check not required.")
              raise SystemExit(0)

          target=year+1
          path=Path("calendar") / f"{target}.json"
          if not path.is_file():
              raise SystemExit(f"ERROR: next-year calendar missing: {path}")

          data=json.loads(path.read_text(encoding="utf-8"))
          if data.get("year") != target:
              raise SystemExit(f"ERROR: {path} year is {data.get('year')}, expected {target}")
          events=data.get("events")
          if not isinstance(events,dict) or not events:
              raise SystemExit(f"ERROR: {path} has no events")

          print(f"OK: next-year calendar ready: {path} ({len(events)} events)")
          PY

      - name: Skip if this scheduled slot is already published
        if: steps.schedule.outputs.run == 'true'
        id: dedupe
        env:
          SLOT: ${{ steps.schedule.outputs.slot }}
          PUBLISH_DATE: ${{ steps.schedule.outputs.date }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "${{ inputs.republish }}" = "true" ]; then
            echo "Explicit one-time manual republish requested; bypassing slot dedupe for this run only."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ] && grep -q "force-republish" .github/trigger-meowcast-evening 2>/dev/null; then
            echo "Explicit one-time production republish trigger; bypassing slot dedupe for this run only."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual run uses publication dedupe unless republish=true was explicitly requested."
          fi
          # Recovery/scheduled runs never bypass dedupe.
          # A plain marker is not enough: a stale or prematurely written marker
          # must never suppress the real morning/evening publication.
          MARKER="${PUBLISH_DATE}-${SLOT}"
          URL="https://raw.githubusercontent.com/audreywang9898-sudo/meowcast-media/main/latest/published-slot.txt?ts=${GITHUB_RUN_ID}"
          EVIDENCE_URL="https://raw.githubusercontent.com/audreywang9898-sudo/meowcast-media/main/latest/published-evidence-${SLOT}.json?ts=${GITHUB_RUN_ID}"
          PUBLISHED=$(curl -fsSL "$URL" || true)
          VALID_EVIDENCE=false
          if [ "$PUBLISHED" = "$MARKER" ] && curl -fsSL "$EVIDENCE_URL" -o /tmp/published-evidence.json; then
            if PUBLISH_DATE="$PUBLISH_DATE" SLOT="$SLOT" python - <<'PY'
          import json, os, sys
          from datetime import datetime, time
          from zoneinfo import ZoneInfo

          try:
              e=json.load(open("/tmp/published-evidence.json",encoding="utf-8"))
              if e.get("date") != os.environ["PUBLISH_DATE"] or e.get("slot") != os.environ["SLOT"]:
                  raise ValueError("date/slot mismatch")
              published=datetime.fromisoformat(e["published_at"].replace("Z","+00:00")).astimezone(ZoneInfo("Asia/Taipei"))
              d=datetime.fromisoformat(os.environ["PUBLISH_DATE"]).date()
              cutoff=time(6,45) if os.environ["SLOT"]=="0700" else time(16,20)
              if published.date()!=d or published.time()<cutoff:
                  raise ValueError(f"published_at {published.isoformat()} is before valid slot window")
              print(f"Valid publish evidence: {published.isoformat()} run={e.get('run_id')}")
          except Exception as ex:
              print(f"Invalid publish evidence: {ex}")
              sys.exit(1)
          PY
            then
              VALID_EVIDENCE=true
            fi
          fi

          if [ "$PUBLISHED" = "$MARKER" ] && [ "$VALID_EVIDENCE" = "true" ]; then
            echo "Scheduled slot already published with valid evidence: $MARKER"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            if [ "$PUBLISHED" = "$MARKER" ]; then
              echo "Marker exists but valid slot evidence is missing/invalid; publishing instead of false-skipping."
            else
              echo "Publishing slot: $MARKER"
            fi
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate today's Reel
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
          MEOWCAST_PERIOD: ${{ steps.schedule.outputs.slot == '1630' && 'evening' || 'morning' }}
        if: steps.schedule.outputs.run == 'true' && steps.dedupe.outputs.skip != 'true'
        run: python render.py

      - name: Verify generated files
        if: steps.schedule.outputs.run == 'true' && steps.dedupe.outputs.skip != 'true'
        run: |
          test -s output/card.jpg
          test -s music/daily_gentle.mp3
          test -s output/meowcast.mp4
          test -s output/caption.txt
          test -s output/weather-state.json
          ffprobe -v error -show_entries stream=codec_type,codec_name -of compact output/meowcast.mp4

      - name: Upload private artifact
        if: steps.schedule.outputs.run == 'true' && steps.dedupe.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: daily-meowcast-${{ github.run_id }}
          path: output/

      - name: Upload Reel to unique public URL
        if: steps.schedule.outputs.run == 'true' && steps.dedupe.outputs.skip != 'true'
        id: media
        env:
          MEDIA_REPO_TOKEN: ${{ secrets.MEDIA_REPO_TOKEN }}
          PUBLISH_DATE: ${{ steps.schedule.outputs.date }}
          SLOT: ${{ steps.schedule.outputs.slot }}
        run: |
          test -n "$MEDIA_REPO_TOKEN" || (echo "MEDIA_REPO_TOKEN missing" && exit 1)
          SAFE_SLOT="$SLOT"
          MEDIA_PATH="reels/${PUBLISH_DATE}/meowcast-${SAFE_SLOT}-${GITHUB_RUN_ID}.mp4"
          git clone "https://x-access-token:${MEDIA_REPO_TOKEN}@github.com/audreywang9898-sudo/meowcast-media.git" /tmp/meowcast-media
          mkdir -p "/tmp/meowcast-media/$(dirname "$MEDIA_PATH")"
          cp output/meowcast.mp4 "/tmp/meowcast-media/$MEDIA_PATH"
          cd /tmp/meowcast-media
          git config user.name "meowcast-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$MEDIA_PATH"
          git commit -m "Add Meowcast Reel ${PUBLISH_DATE} ${SAFE_SLOT} run ${GITHUB_RUN_ID}"
          git push origin main
          echo "path=$MEDIA_PATH" >> "$GITHUB_OUTPUT"
          echo "url=https://raw.githubusercontent.com/audreywang9898-sudo/meowcast-media/main/$MEDIA_PATH" >> "$GITHUB_OUTPUT"

      - name: Verify exact public Reel bytes
        if: steps.schedule.outputs.run == 'true' && steps.dedupe.outputs.skip != 'true'
        env:
          REEL_PUBLIC_URL: ${{ steps.media.outputs.url }}
        run: |
          LOCAL_SHA=$(sha256sum output/meowcast.mp4 | awk '{print $1}')
          for i in {1..18}; do
            if curl -fL --retry 2 --retry-delay 2 -o /tmp/public-meowcast.mp4 "$REEL_PUBLIC_URL?run=${GITHUB_RUN_ID}"; then
              REMOTE_SHA=$(sha256sum /tmp/public-meowcast.mp4 | awk '{print $1}')
              if [ "$REMOTE_SHA" = "$LOCAL_SHA" ]; then
                echo "Unique public Reel URL is reachable and bytes match."
                exit 0
              fi
              echo "Public URL returned different bytes; waiting..."
            fi
            sleep 5
          done
          echo "Public Reel URL did not become ready with matching bytes."
          exit 1

      - name: Publish Reel to Instagram
        if: steps.schedule.outputs.run == 'true' && steps.dedupe.outputs.skip != 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          REEL_PUBLIC_URL: ${{ steps.media.outputs.url }}?run=${{ github.run_id }}
        run: |
          test -n "$IG_USER_ID" || (echo "IG_USER_ID missing" && exit 1)
          test -n "$IG_ACCESS_TOKEN" || (echo "IG_ACCESS_TOKEN missing" && exit 1)
          python publish_instagram.py

      - name: Mark scheduled slot as published
        if: steps.schedule.outputs.run == 'true' && steps.dedupe.outputs.skip != 'true' && success()
        env:
          MEDIA_REPO_TOKEN: ${{ secrets.MEDIA_REPO_TOKEN }}
          PUBLISH_DATE: ${{ steps.schedule.outputs.date }}
          SLOT: ${{ steps.schedule.outputs.slot }}
        run: |
          MARKER="${PUBLISH_DATE}-${SLOT}"
          git clone "https://x-access-token:${MEDIA_REPO_TOKEN}@github.com/audreywang9898-sudo/meowcast-media.git" /tmp/meowcast-marker
          mkdir -p /tmp/meowcast-marker/latest
          printf "%s" "$MARKER" > /tmp/meowcast-marker/latest/published-slot.txt
          cp output/weather-state.json "/tmp/meowcast-marker/latest/weather-state-${SLOT}.json"
          PUBLISHED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          PUBLISH_DATE="$PUBLISH_DATE" SLOT="$SLOT" PUBLISHED_AT="$PUBLISHED_AT" python - <<'PY'
          import json, os
          slot=os.environ["SLOT"]
          latest="/tmp/meowcast-marker/latest"
          candidate=json.load(open("output/weather-state.json",encoding="utf-8"))
          path=f"{latest}/weather-rotation-{slot}.json"
          try:
              state=json.load(open(path,encoding="utf-8"))
          except Exception:
              state={}
          state[candidate["theme"]]=candidate["index"]
          with open(path,"w",encoding="utf-8") as f:
              json.dump(state,f,ensure_ascii=False,sort_keys=True)

          evidence={
              "date": os.environ["PUBLISH_DATE"],
              "slot": slot,
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "published_at": os.environ["PUBLISHED_AT"],
          }
          with open(f"{latest}/published-evidence-{slot}.json","w",encoding="utf-8") as f:
              json.dump(evidence,f,ensure_ascii=False,sort_keys=True)
          PY
          cd /tmp/meowcast-marker
          git config user.name "meowcast-bot"
          git config user.email "actions@users.noreply.github.com"
          git add latest/published-slot.txt "latest/published-evidence-${SLOT}.json" "latest/weather-state-${SLOT}.json" "latest/weather-rotation-${SLOT}.json"
          git commit -m "Mark Meowcast published $MARKER" || exit 0
          git push origin main
