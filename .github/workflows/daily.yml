name: Daily Meowcast
on:
  schedule:
    # Avoid :00/:01 where GitHub Actions scheduled-event load is highest.
    # Multiple recovery triggers are safe because publication evidence dedupes each slot.
    - cron: '7 23 * * *'   # 07:07 Taipei primary
    - cron: '17 23 * * *'  # 07:17 recovery
    - cron: '7 0 * * *'    # 08:07 final morning self-guard
    # Early recovery probes: on-time runs exit cleanly; delayed runs can recover after 16:25 Taipei.
    - cron: '30 7 * * *'   # 15:30 Taipei early recovery probe
    - cron: '30 8 * * *'   # 16:30 Taipei primary
    - cron: '40 8 * * *'   # 16:40 recovery
    - cron: '50 8 * * *'   # 16:50 recovery
    - cron: '7 9 * * *'    # 17:07 final evening self-guard
  workflow_dispatch:
    inputs:
      period:
        description: 'Edition to publish; auto selects the current local shift'
        required: true
        default: auto
        type: choice
        options: [auto, morning, evening]
      republish:
        description: 'Explicit one-time republish; bypass slot dedupe only for manual dispatch'
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - '.github/trigger-meowcast-evening'
      - '.github/recovery/morning-*'
      - '.github/recovery/evening-*'

permissions:
  contents: read

jobs:
  reel:
    runs-on: ubuntu-latest
    env:
      CITY: taipei
    concurrency:
      # Serialize each slot. Recovery runs queue behind an in-flight primary run,
      # then dedupe against the published marker before doing any work.
      group: meowcast-publisher-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Validate production weather artwork
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          failures=[]
          for p in sorted(Path("asset/taipei").glob("*.png")):
              # Rotating weather artwork only; festival/UI assets are checked by render when selected.
              if not any(p.name.startswith(x) for x in ("sunny-","cloudy-","rainy-","sunny_evening-","cloudy_evening-","rainy_evening-")):
                  continue
              try:
                  if p.stat().st_size <= 1024:
                      raise ValueError(f"file too small ({p.stat().st_size} bytes)")
                  with Image.open(p) as im:
                      im.verify()
              except Exception as exc:
                  failures.append(f"{p}: {exc}")
          if failures:
              print("WARNING: invalid rotating artwork found; render.py will skip these files:")
              print("\\n".join(failures))
          else:
              print("All rotating Taipei weather artwork is valid.")
          PY

      - name: Check schedule config
        id: schedule
        env:
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}
          MANUAL_PERIOD: ${{ inputs.period }}
          GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo

          cfg=json.load(open("schedule.json",encoding="utf-8"))
          event=os.environ.get("GITHUB_EVENT_NAME","")
          tz=ZoneInfo(cfg.get("timezone","Asia/Taipei"))
          now=datetime.now(tz)
          now_utc=datetime.now(timezone.utc)
          run=True
          valid=True
          slot="manual"
          reason="manual run"

          if event=="workflow_dispatch":
              period=os.environ.get("MANUAL_PERIOD","auto")
              if period=="auto":
                  period="evening" if now.hour>=16 else "morning"
              slot="1630" if period=="evening" else "0700"
              reason=f"manual {period} production publish"
          elif event=="push":
              # Resolve the exact pushed files from GitHub's commit API.
              # Never default an unrecognized morning marker to the evening edition.
              from urllib.request import Request, urlopen
              try:
                  repo=os.environ["GITHUB_REPOSITORY"]
                  sha=os.environ["GITHUB_SHA"]
                  api_url=f"https://api.github.com/repos/{repo}/commits/{sha}"
                  request=Request(api_url, headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": "Bearer " + os.environ["GITHUB_API_TOKEN"],
                  })
                  with urlopen(request, timeout=15) as response:
                      commit_info=json.load(response)
                  changed_paths={f.get("filename") for f in commit_info.get("files", [])}
              except Exception:
                  changed_paths=set()
                  print("ERROR: Unable to verify push commit changed paths; fail closed.")
              if any(p and p.startswith(".github/recovery/morning-") for p in changed_paths):
                  slot="0700"
                  reason="verified one-shot morning recovery push"
              elif any(p and p.startswith(".github/recovery/evening-") for p in changed_paths):
                  slot="1630"
                  reason="verified one-shot evening recovery push"
              elif ".github/trigger-meowcast-evening" in changed_paths:
                  try:
                      recovery_trigger=open(".github/trigger-meowcast-evening",encoding="utf-8").read()
                  except OSError:
                      recovery_trigger=""
                  slot="0700" if "force-morning" in recovery_trigger else "1630"
                  reason="verified production recovery trigger"
              else:
                  run=False
                  valid=False
                  reason="unrecognized or unverified recovery push; refusing to publish"

          elif event=="schedule":
              if not cfg.get("enabled", True):
                  run=False; reason="schedule disabled"
              else:
                  # Identify the intended slot from the cron expression that fired.
                  # Do NOT infer it from wall-clock start time: GitHub schedule jobs can be delayed.
                  trigger=os.environ.get("TRIGGER_SCHEDULE","").strip()
                  morning={"7 23 * * *","17 23 * * *","27 23 * * *","37 23 * * *","7 0 * * *"}
                  evening_probe={"30 5 * * *","30 6 * * *","30 7 * * *"}
                  evening={"30 8 * * *","40 8 * * *","50 8 * * *","7 9 * * *"}
                  if trigger in morning:
                      run=True; slot="0700"; reason=f"morning cron trigger: {trigger}"
                      # GitHub Actions cron may start many hours late. The publish
                      # date must come from the cron's intended UTC day, not the
                      # runner's delayed Taipei wall clock. 23:xx UTC belongs to
                      # the following Taipei calendar day.
                      # Resolve the most recent occurrence of this cron, even after midnight UTC.
                      minute,hour=map(int,trigger.split()[:2])
                      intended_utc=now_utc.replace(hour=hour,minute=minute,second=0,microsecond=0)
                      if intended_utc>now_utc:
                          intended_utc-=timedelta(days=1)
                      intended_date=intended_utc.astimezone(tz).date().isoformat()
                  elif trigger in evening_probe or trigger in evening:
                      slot="1630"
                      if trigger in evening_probe and (now.hour, now.minute) < (16,25):
                          run=False; reason=f"early evening recovery probe exited safely: {trigger}"
                      else:
                          run=True; reason=f"evening cron trigger: {trigger}"
                      # 08:30-09:00 UTC belongs to the same Taipei calendar day.
                      # Keeping the UTC calendar date prevents a delayed evening
                      # run after Taipei midnight from becoming tomorrow's slot.
                      minute,hour=map(int,trigger.split()[:2])
                      intended_utc=now_utc.replace(hour=hour,minute=minute,second=0,microsecond=0)
                      if intended_utc>now_utc:
                          intended_utc-=timedelta(days=1)
                      intended_date=intended_utc.astimezone(tz).date().isoformat()
                  else:
                      run=False; valid=False; reason=f"unknown schedule trigger: {trigger!r}"

          date=intended_date if event=="schedule" and run else now.strftime("%Y-%m-%d")
          print(reason)
          print(f"date={date} slot={slot}")
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write(f"run={'true' if run else 'false'}\n")
              out.write(f"valid={'true' if valid else 'false'}\n")
              out.write(f"date={date}\n")
              out.write(f"slot={slot}\n")
          PY

      - name: Reject unknown scheduled trigger
        if: github.event_name == 'schedule' && steps.schedule.outputs.valid != 'true'
        run: |
          echo "ERROR: scheduled workflow did not map to a publish slot."
          echo "This prevents a false-green run where every publish step is skipped."
          exit 1

      - name: Verify next-year calendar on December 2
        if: steps.schedule.outputs.run == 'true'
        env:
          PUBLISH_DATE: ${{ steps.schedule.outputs.date }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          today=os.environ["PUBLISH_DATE"]
          year,month,day=map(int,today.split("-"))
          if (month,day)!=(12,2):
              print("Not December 2; yearly calendar check not required.")
              raise SystemExit(0)

          target=year+1
          path=Path("calendar") / f"{target}.json"
          if not path.is_file():
              raise SystemExit(f"ERROR: next-year calendar missing: {path}")

          data=json.loads(path.read_text(encoding="utf-8"))
          if data.get("year") != target:
              raise SystemExit(f"ERROR: {path} year is {data.get('year')}, expected {target}")
          events=data.get("events")
          if not isinstance(events,dict) or not events:
              raise SystemExit(f"ERROR: {path} has no events")

          print(f"OK: next-year calendar ready: {path} ({len(events)} events)")
          PY

      - name: Skip if this scheduled slot is already published
        if: steps.schedule.outputs.run == 'true'
        id: dedupe
        env:
          SLOT: ${{ steps.schedule.outputs.slot }}
          PUBLISH_DATE: ${{ steps.schedule.outputs.date }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "${{ inputs.republish }}" = "true" ]; then
            echo "Explicit one-time manual republish requested; bypassing slot dedupe for this run only."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual run uses publication dedupe unless republish=true was explicitly requested."
          fi
          # Recovery/scheduled runs never bypass dedupe.
          # A plain marker is not enough: a stale or prematurely written marker
          # must never suppress the real morning/evening publication.
          MARKER="${PUBLISH_DATE}-${SLOT}"
          URL="https://raw.githubusercontent.com/audreywang9898-sudo/meowcast-media/main/latest/published-slot.txt?ts=${GITHUB_RUN_ID}"
          EVIDENCE_URL="https://raw.githubusercontent.com/audreywang9898-sudo/meowcast-media/main/latest/published-evidence-${SLOT}.json?ts=${GITHUB_RUN_ID}"
          PUBLISHED=$(curl -fsSL "$URL" || true)
          VALID_EVIDENCE=false
          # Compatibility with morning manual runs made before slot normalization.
          # Their evidence must still pass the same date/time checks below.
          if [ "$SLOT" = "0700" ] && [ "$PUBLISHED" = "${PUBLISH_DATE}-manual" ]; then
            MARKER="$PUBLISHED"
            EVIDENCE_URL="https://raw.githubusercontent.com/audreywang9898-sudo/meowcast-media/main/latest/published-evidence-manual.json?ts=${GITHUB_RUN_ID}"
          fi
          if [ "$PUBLISHED" = "$MARKER" ] && curl -fsSL "$EVIDENCE_URL" -o /tmp/published-evidence.json; then
            if PUBLISH_DATE="$PUBLISH_DATE" SLOT="$SLOT" python - <<'PY'
          import json, os, sys
          from datetime import datetime, time
          from zoneinfo import ZoneInfo

          try:
              e=json.load(open("/tmp/published-evidence.json",encoding="utf-8"))
              if e.get("date") != os.environ["PUBLISH_DATE"] or e.get("slot") not in ({os.environ["SLOT"], "manual"} if os.environ["SLOT"]=="0700" else {os.environ["SLOT"]}):
                  raise ValueError("date/slot mismatch")
              published=datetime.fromisoformat(e["published_at"].replace("Z","+00:00")).astimezone(ZoneInfo("Asia/Taipei"))
              d=datetime.fromisoformat(os.environ["PUBLISH_DATE"]).date()
              cutoff=time(6,45) if os.environ["SLOT"]=="0700" else time(16,20)
              if published.date()!=d or published.time()<cutoff:
                  raise ValueError(f"published_at {published.isoformat()} is before valid slot window")
              print(f"Valid publish evidence: {published.isoformat()} run={e.get('run_id')}")
          except Exception as ex:
              print(f"Invalid publish evidence: {ex}")
              sys.exit(1)
          PY
            then
              VALID_EVIDENCE=true
            fi
          fi

          if [ "$PUBLISHED" = "$MARKER" ] && [ "$VALID_EVIDENCE" = "true" ]; then
            echo "Scheduled slot already published with valid evidence: $MARKER"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            if [ "$PUBLISHED" = "$MARKER" ]; then
              echo "Marker exists but valid slot evidence is missing/invalid; publishing instead of false-skipping."
            else
              echo "Publishing slot: $MARKER"
            fi
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate today's Reel
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
          MEOWCAST_PERIOD: ${{ steps.schedule.outputs.slot == '1630' && 'evening' || 'morning' }}
        if: steps.schedule.outputs.run == 'true' && steps.dedupe.outputs.skip != 'true'
        run: python render.py

      - name: Verify generated files
        if: steps.schedule.outputs.run == 'true' && steps.dedupe.outputs.skip != 'true'
        run: |
          test -s output/card.jpg
          test -s music/daily_gentle.mp3
          test -s output/meowcast.mp4
          test -s output/caption.txt
          test -s output/weather-state.json
          ffprobe -v error -show_entries stream=codec_type,codec_name -of compact output/meowcast.mp4

      - name: Upload private artifact
        if: steps.schedule.outputs.run == 'true' && steps.dedupe.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: daily-meowcast-${{ github.run_id }}
          path: output/

      - name: Upload Reel to unique public URL
        if: steps.schedule.outputs.run == 'true' && steps.dedupe.outputs.skip != 'true'
        id: media
        env:
          MEDIA_REPO_TOKEN: ${{ secrets.MEDIA_REPO_TOKEN }}
          PUBLISH_DATE: ${{ steps.schedule.outputs.date }}
          SLOT: ${{ steps.schedule.outputs.slot }}
        run: |
          test -n "$MEDIA_REPO_TOKEN" || (echo "MEDIA_REPO_TOKEN missing" && exit 1)
          SAFE_SLOT="$SLOT"
          MEDIA_PATH="reels/${PUBLISH_DATE}/meowcast-${SAFE_SLOT}-${GITHUB_RUN_ID}.mp4"
          git clone "https://x-access-token:${MEDIA_REPO_TOKEN}@github.com/audreywang9898-sudo/meowcast-media.git" /tmp/meowcast-media
          mkdir -p "/tmp/meowcast-media/$(dirname "$MEDIA_PATH")"
          cp output/meowcast.mp4 "/tmp/meowcast-media/$MEDIA_PATH"
          cd /tmp/meowcast-media
          git config user.name "meowcast-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$MEDIA_PATH"
          git commit -m "Add Meowcast Reel ${PUBLISH_DATE} ${SAFE_SLOT} run ${GITHUB_RUN_ID}"
          git push origin main
          echo "path=$MEDIA_PATH" >> "$GITHUB_OUTPUT"
          echo "url=https://raw.githubusercontent.com/audreywang9898-sudo/meowcast-media/main/$MEDIA_PATH" >> "$GITHUB_OUTPUT"

      - name: Verify exact public Reel bytes
        if: steps.schedule.outputs.run == 'true' && steps.dedupe.outputs.skip != 'true'
        env:
          REEL_PUBLIC_URL: ${{ steps.media.outputs.url }}
        run: |
          LOCAL_SHA=$(sha256sum output/meowcast.mp4 | awk '{print $1}')
          for i in {1..18}; do
            if curl -fL --retry 2 --retry-delay 2 -o /tmp/public-meowcast.mp4 "$REEL_PUBLIC_URL?run=${GITHUB_RUN_ID}"; then
              REMOTE_SHA=$(sha256sum /tmp/public-meowcast.mp4 | awk '{print $1}')
              if [ "$REMOTE_SHA" = "$LOCAL_SHA" ]; then
                echo "Unique public Reel URL is reachable and bytes match."
                exit 0
              fi
              echo "Public URL returned different bytes; waiting..."
            fi
            sleep 5
          done
          echo "Public Reel URL did not become ready with matching bytes."
          exit 1

      - name: Publish Reel to Instagram
        if: steps.schedule.outputs.run == 'true' && steps.dedupe.outputs.skip != 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          REEL_PUBLIC_URL: ${{ steps.media.outputs.url }}?run=${{ github.run_id }}
        run: |
          test -n "$IG_USER_ID" || (echo "IG_USER_ID missing" && exit 1)
          test -n "$IG_ACCESS_TOKEN" || (echo "IG_ACCESS_TOKEN missing" && exit 1)
          python publish_instagram.py

      - name: Mark scheduled slot as published
        if: steps.schedule.outputs.run == 'true' && steps.dedupe.outputs.skip != 'true' && success()
        env:
          MEDIA_REPO_TOKEN: ${{ secrets.MEDIA_REPO_TOKEN }}
          PUBLISH_DATE: ${{ steps.schedule.outputs.date }}
          SLOT: ${{ steps.schedule.outputs.slot }}
        run: |
          # A successful workflow is insufficient: require this run's Meta receipt.
          python - <<'PY'
          import json, os
          result=json.load(open("output/publish-result.json",encoding="utf-8"))
          expected="taipei"
          if result.get("status")!="published" or not result.get("media_id") or not result.get("container_id") or result.get("city")!=expected or result.get("run_id")!=os.environ.get("GITHUB_RUN_ID"):
              raise SystemExit("Missing or invalid Meta publication receipt; refusing success marker")
          PY
          MARKER="${PUBLISH_DATE}-${SLOT}"
          git clone "https://x-access-token:${MEDIA_REPO_TOKEN}@github.com/audreywang9898-sudo/meowcast-media.git" /tmp/meowcast-marker
          mkdir -p /tmp/meowcast-marker/latest
          printf "%s" "$MARKER" > /tmp/meowcast-marker/latest/published-slot.txt
          cp output/weather-state.json "/tmp/meowcast-marker/latest/weather-state-${SLOT}.json"
          PUBLISHED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          PUBLISH_DATE="$PUBLISH_DATE" SLOT="$SLOT" PUBLISHED_AT="$PUBLISHED_AT" python - <<'PY'
          import json, os
          slot=os.environ["SLOT"]
          latest="/tmp/meowcast-marker/latest"
          candidate=json.load(open("output/weather-state.json",encoding="utf-8"))
          path=f"{latest}/weather-rotation-{slot}.json"
          try:
              state=json.load(open(path,encoding="utf-8"))
          except Exception:
              state={}
          state[candidate["theme"]]=candidate["index"]
          with open(path,"w",encoding="utf-8") as f:
              json.dump(state,f,ensure_ascii=False,sort_keys=True)

          receipt=json.load(open("output/publish-result.json",encoding="utf-8"))
          evidence={
              "media_id":receipt["media_id"],
              "container_id":receipt["container_id"],
              "status":"published",
              "date": os.environ["PUBLISH_DATE"],
              "slot": slot,
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "published_at": os.environ["PUBLISHED_AT"],
              "video_path": f"reels/{os.environ['PUBLISH_DATE']}/meowcast-{slot}-{os.environ['GITHUB_RUN_ID']}.mp4",
              "caption": open("output/caption.txt",encoding="utf-8").read().strip(),
          }
          with open(f"{latest}/published-evidence-{slot}.json","w",encoding="utf-8") as f:
              json.dump(evidence,f,ensure_ascii=False,sort_keys=True)
          # Keep a permanent source receipt for Facebook-only recovery, including early manual posts.
          from pathlib import Path
          archive=Path("/tmp/meowcast-marker") / evidence["video_path"].replace(".mp4", ".json")
          archive.parent.mkdir(parents=True,exist_ok=True)
          archive.write_text(json.dumps(evidence,ensure_ascii=False,sort_keys=True),encoding="utf-8")
          PY
          cd /tmp/meowcast-marker
          git config user.name "meowcast-bot"
          git config user.email "actions@users.noreply.github.com"
          git add latest/published-slot.txt "latest/published-evidence-${SLOT}.json" "latest/weather-state-${SLOT}.json" "latest/weather-rotation-${SLOT}.json" "reels/${PUBLISH_DATE}/meowcast-${SLOT}-${GITHUB_RUN_ID}.json"
          git commit -m "Mark Meowcast published $MARKER" || exit 0
          git push origin main

      - name: Publish Taipei Reel to Facebook Page
        # Also run after Instagram dedupe: a recovery can finish Facebook only.
        # Instagram evidence is committed first and is never changed by this step.
        if: steps.schedule.outputs.run == 'true' && success()
        id: facebook
        # Preserve the existing Instagram run outcome/recovery behavior.
        continue-on-error: true
        env:
          MEDIA_REPO_TOKEN: ${{ secrets.MEDIA_REPO_TOKEN }}
          TAIPEI_FB_PAGE_ID: ${{ secrets.TAIPEI_FB_PAGE_ID }}
          TAIPEI_FB_PAGE_ACCESS_TOKEN: ${{ secrets.TAIPEI_FB_PAGE_ACCESS_TOKEN }}
          PUBLISH_DATE: ${{ steps.schedule.outputs.date }}
          SLOT: ${{ steps.schedule.outputs.slot }}
        run: python publish_facebook.py

      - name: Report Facebook-only failure
        if: steps.facebook.outcome == 'failure'
        run: |
          echo "::warning::Instagram succeeded; Facebook failed or is still pending. Use Taipei Facebook Page for Facebook-only recovery."
          echo "Facebook: failed or pending. Instagram receipt is preserved. Use the Taipei Facebook Page workflow to retry Facebook only." >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Facebook publication did not succeed; marking run failed while preserving Instagram receipt."
          exit 1
