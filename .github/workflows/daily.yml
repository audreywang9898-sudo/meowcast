name: Daily Meowcast
on:
  schedule:
    - cron: '50 22 * * *'\n    - cron: '10 23 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Skip if today's Reel is already published
        id: dedupe
        run: |
          TODAY=$(TZ=Asia/Taipei date +%F)
          PUBLISHED=$(curl -fsSL "https://raw.githubusercontent.com/audreywang9898-sudo/meowcast-media/main/latest/published-date.txt?ts=$(date +%s)" || true)
          if [ "$PUBLISHED" = "$TODAY" ]; then
            echo "Today's Reel was already published: $TODAY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate today's Reel
        if: steps.dedupe.outputs.skip != 'true'
        run: python render.py

      - name: Verify generated files
        if: steps.dedupe.outputs.skip != 'true'
        run: |
          test -s output/card.jpg
          test -s output/bgm.wav
          test -s output/meowcast.mp4
          test -s output/caption.txt
          ffprobe -v error -show_entries stream=codec_type,codec_name -of compact output/meowcast.mp4

      - name: Upload private artifact
        if: steps.dedupe.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: daily-meowcast
          path: output/

      - name: Upload Reel to public media repository
        if: steps.dedupe.outputs.skip != 'true'
        env:
          MEDIA_REPO_TOKEN: ${{ secrets.MEDIA_REPO_TOKEN }}
        run: |
          test -n "$MEDIA_REPO_TOKEN" || (echo "MEDIA_REPO_TOKEN missing" && exit 1)
          git clone "https://x-access-token:${MEDIA_REPO_TOKEN}@github.com/audreywang9898-sudo/meowcast-media.git" /tmp/meowcast-media
          mkdir -p /tmp/meowcast-media/latest
          cp output/meowcast.mp4 /tmp/meowcast-media/latest/meowcast.mp4
          cd /tmp/meowcast-media
          git config user.name "meowcast-bot"
          git config user.email "actions@users.noreply.github.com"
          git add latest/meowcast.mp4
          if git diff --cached --quiet; then
            echo "Media file unchanged."
          else
            git commit -m "Update daily Meowcast Reel"
            git push origin main
          fi

      - name: Verify public Reel URL
        if: steps.dedupe.outputs.skip != 'true'
        run: |
          URL="https://raw.githubusercontent.com/audreywang9898-sudo/meowcast-media/main/latest/meowcast.mp4"
          for i in {1..12}; do
            CODE=$(curl -L -s -o /dev/null -w "%{http_code}" "$URL")
            if [ "$CODE" = "200" ]; then
              echo "Public Reel is reachable."
              exit 0
            fi
            echo "Waiting for public Reel URL (HTTP $CODE)..."
            sleep 5
          done
          echo "Public Reel URL did not become reachable."
          exit 1

      - name: Publish Reel to Instagram
        if: steps.dedupe.outputs.skip != 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          REEL_PUBLIC_URL: https://raw.githubusercontent.com/audreywang9898-sudo/meowcast-media/main/latest/meowcast.mp4
        run: |
          test -n "$IG_USER_ID" || (echo "IG_USER_ID missing" && exit 1)
          test -n "$IG_ACCESS_TOKEN" || (echo "IG_ACCESS_TOKEN missing" && exit 1)
          sleep 10
          python publish_instagram.py

      - name: Mark today's Reel as published
        if: steps.dedupe.outputs.skip != 'true' && success()
        env:
          MEDIA_REPO_TOKEN: ${{ secrets.MEDIA_REPO_TOKEN }}
        run: |
          TODAY=$(TZ=Asia/Taipei date +%F)
          git clone "https://x-access-token:${MEDIA_REPO_TOKEN}@github.com/audreywang9898-sudo/meowcast-media.git" /tmp/meowcast-marker
          mkdir -p /tmp/meowcast-marker/latest
          printf "%s" "$TODAY" > /tmp/meowcast-marker/latest/published-date.txt
          cd /tmp/meowcast-marker
          git config user.name "meowcast-bot"
          git config user.email "actions@users.noreply.github.com"
          git add latest/published-date.txt
          git commit -m "Mark Meowcast published $TODAY" || exit 0
          git push origin main
