name: Taipei Facebook Page
on:
  push:
    branches: [main]
    paths:
      - 'publish_facebook.py'
      - 'test_facebook.py'
      - '.github/workflows/facebook.yml'
      - '.github/workflows/daily.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'check = read-only credentials check; publish = Facebook only (no Instagram repost)'
        type: choice
        options: [check, publish]
        default: check
        required: true
      date:
        description: 'Taipei publication date YYYY-MM-DD (required for publish)'
        type: string
        required: false
      slot:
        description: 'Original Instagram edition'
        type: choice
        options: ['0700', '1630']
        default: '0700'
        required: true
      source_run_id:
        description: 'Optional original Daily Meowcast run ID, for an older/early manual post'
        type: string
        required: false
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests PyYAML
      - name: Test Facebook recovery and daily schedule preservation
        run: python -m unittest -v test_facebook
      - name: Verify Facebook Page configuration (read only)
        env:
          TAIPEI_FB_PAGE_ID: ${{ secrets.TAIPEI_FB_PAGE_ID }}
          TAIPEI_FB_PAGE_ACCESS_TOKEN: ${{ secrets.TAIPEI_FB_PAGE_ACCESS_TOKEN }}
        run: python publish_facebook.py --check-config
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'publish'
    needs: validate
    runs-on: ubuntu-latest
    concurrency:
      # Only a real publisher shares the daily lock; read-only CI cannot queue/cancel a daily run.
      group: meowcast-publisher-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Publish or recover Facebook only
        env:
          MEDIA_REPO_TOKEN: ${{ secrets.MEDIA_REPO_TOKEN }}
          TAIPEI_FB_PAGE_ID: ${{ secrets.TAIPEI_FB_PAGE_ID }}
          TAIPEI_FB_PAGE_ACCESS_TOKEN: ${{ secrets.TAIPEI_FB_PAGE_ACCESS_TOKEN }}
          PUBLISH_DATE: ${{ inputs.date }}
          SLOT: ${{ inputs.slot }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: python publish_facebook.py
