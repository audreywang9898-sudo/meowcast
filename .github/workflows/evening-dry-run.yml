name: Evening Meowcast Dry Run
# rerun-trigger: 2026-09-24 badge-tonight-fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/evening-dry-run.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Render today's evening forecast without publishing
        env:
          MEOWCAST_PERIOD: evening
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python render.py
      - name: Verify evening outputs
        run: |
          test -s output/card.jpg
          test -s output/meowcast.mp4
          test -s output/caption.txt
          ffprobe -v error -show_entries stream=codec_type,codec_name -of compact output/meowcast.mp4
      - name: Save evening preview to GitHub
        run: |
          mkdir -p dry-run
          cp output/card.jpg dry-run/evening_weather.jpg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dry-run/evening_weather.jpg
          git diff --cached --quiet && exit 0
          git commit -m "Update evening weather dry-run preview"
          git push origin main
