services:
  - type: cron
    name: meowcast-external-watchdog
    runtime: python
    repo: https://github.com/audreywang9898-sudo/meowcast
    branch: main
    schedule: "*/15 * * * *"
    buildCommand: ""
    startCommand: "python watchdog.py"
    envVars:
      - key: MEOWCAST_GITHUB_TOKEN
        sync: false
      - key: WATCHDOG_DRY_RUN
        value: "false"
